name: Validate plugins
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: git diff --exit-code -- packages/ui-enhancements/client.js
      - run: npm run pack:plugins
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-packages-node-${{ matrix.node }}
          path: dist/*.tgz
